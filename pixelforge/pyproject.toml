[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelforge"
version = "1.0.0"
description = "Universal Intelligent Image Compression Studio"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PixelForge Contributors" }]
dependencies = [
    "Pillow>=11.0.0",
    "pillow-avif-plugin>=1.4.0",
    "pillow-heif>=0.18.0",
    "pillow-jxl-plugin>=1.0.0",
    "numpy>=1.26.0",
    "scikit-image>=0.23.0",
    "imagehash>=4.3.1",
    "piexif>=1.1.3",
    "PySide6>=6.6.0",
    "click>=8.1.0",
]

[project.scripts]
pixelforge = "cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
